name: awsRag

services:
  postgres:
    image: postgres:latest
    container_name: awsRag_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set one up bruh}
      POSTGRES_USER: ${POSTGRES_USER:?set one up bruh}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set one up bruh}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
    



