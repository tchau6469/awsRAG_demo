[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp_server"
version = "0.1.0"
description = "AgentCore MCP Server"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp >= 1.24.0, <2.0 ",
    "pydantic >= 2.0, < 3.0",
    "psycopg[binary] >= 3.3, < 4.0",
    "python-dotenv >= 1.0, < 2.0",
    "boto3 >= 1.35, < 2.0",
    "botocore[crt] >= 1.35, < 2.0",
    
]

[tool.hatch.build.targets.wheel]
packages = ["."]
